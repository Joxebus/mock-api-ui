server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Proxy the backend routes to the mock-api service (same-origin from the
    # browser's perspective, so no CORS is involved). "backend" is the compose
    # service name; ${BACKEND_UPSTREAM} (default http://backend:8090, see Dockerfile)
    # is substituted by the nginx image's envsubst templating at container start.
    location /config {
        proxy_pass ${BACKEND_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /endpoint {
        proxy_pass ${BACKEND_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The mocked APIs themselves, so you can exercise them from the same origin.
    # Note the trailing slash: matches "/api/..." only, so SPA routes like
    # "/apis/new" are NOT captured here and fall through to the SPA fallback.
    location /api/ {
        proxy_pass ${BACKEND_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: serve index.html for client-side routes (e.g. /apis/new).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
